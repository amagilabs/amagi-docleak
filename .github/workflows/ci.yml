name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (26.04) has no Python 3.9 build; 24.04 does.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      # every example leaks something, so the check must fail (exit 1)
      - run: code=0; amagi-docleak examples || code=$?; test $code -eq 1
      - run: code=0; amagi-docleak check --json examples/exhibit-b.pdf > report.json || code=$?; test $code -eq 1
      # cleaned copies, with hidden sheets and slides made visible, must pass (exit 0)
      - run: amagi-docleak clean --unhide --out-dir out examples
      - run: amagi-docleak checks
