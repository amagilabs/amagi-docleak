name: Publish to PyPI

# Manual runs only for now. PyPI has no trusted publisher configured for
# amagi-docleak yet, so a release-triggered run fails with "invalid-publisher".
# Releases are uploaded with twine until the trusted publisher is added on
# pypi.org (owner amagilabs, repo amagi-docleak, workflow publish.yml,
# environment pypi). Then restore the trigger:
#   release:
#     types: [published]
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
